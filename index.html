<!doctype html>
<html><head><meta charset="utf-8"><title>hand-synth</title>
<style>body{margin:0;background:#111;color:#eee;font-family:sans-serif;text-align:center}#w{position:relative;width:90vw;max-width:1200px;margin:auto}#viz{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px)}#c{position:relative;width:100%;display:block;transform:scaleX(-1);border-radius:8px}</style>
</head><body>
<p>Click Start. Index finger: left/right = pitch, up/down = volume.</p>
<button id="go">Start</button><br><video id="v" hidden playsinline></video><div id="w"><canvas id="viz"></canvas><canvas id="c" width="1280" height="720"></canvas></div>
<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d');
go.onclick=async()=>{
  go.remove();
  const ac=new AudioContext(),o=ac.createOscillator(),g=ac.createGain();
  o.type='sawtooth';g.gain.value=0;const an=ac.createAnalyser();an.fftSize=256;const fd=new Uint8Array(128);o.connect(g).connect(an).connect(ac.destination);o.start();
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const hl=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},runningMode:"VIDEO",numHands:1});
  v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}});await v.play();
  const loop=()=>{
    x.drawImage(v,0,0,c.width,c.height);
    const r=hl.detectForVideo(v,performance.now()),t=ac.currentTime;
    if(r.landmarks[0]){
      const p=r.landmarks[0][8],nx=1-p.x;
      o.frequency.setTargetAtTime(110*2**(nx*3),t,.03);
      g.gain.setTargetAtTime((1-p.y)*.3,t,.03);
      x.fillStyle='#0f0';x.beginPath();x.arc(p.x*c.width,p.y*c.height,10,0,7);x.fill();
    }else g.gain.setTargetAtTime(0,t,.1);
    const z=viz,q=z.getContext('2d');z.width=z.clientWidth;z.height=z.clientHeight;an.getByteFrequencyData(fd);
    const W=z.width,H=z.height,n=64;q.clearRect(0,0,W,H);
    for(let i=0;i<n;i++){const a=fd[i]/255*30,h=(i*5+t*60)%360;q.fillStyle=`hsl(${h},90%,60%)`;const bx=W/n,by=H/n;
      q.fillRect(i*bx,30-a,bx-2,a);q.fillRect(W-(i+1)*bx,H-30,bx-2,a);q.fillRect(30-a,H-(i+1)*by,a,by-2);q.fillRect(W-30,i*by,a,by-2);}
    requestAnimationFrame(loop);
  };loop();
};
</script></body></html>
